plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base { archivesName = 'cidercore' }

// Fabric-only glue (LoaderPaths); the NeoForge build will get its own copy later.
sourceSets.main.java.srcDir 'src/fabric/java'

dependencies {
	// MC 26.3 is unobfuscated: non-remapping Loom, so there is no `mappings` dependency and
	// no `mod*` configurations. See docs/recon/build-mechanics.md §2.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	toolchain { languageVersion = JavaLanguageVersion.of(25) }
	withSourcesJar()
}

// Objective-C bridge to Metal, compiled with the system clang and bundled in the jar.
def nativeSrc = file("src/main/native")
def nativeOut = layout.buildDirectory.file("native/libciderlight.dylib")
tasks.register('buildNative', Exec) {
	inputs.dir nativeSrc
	outputs.file nativeOut
	doFirst { nativeOut.get().asFile.parentFile.mkdirs() }
	commandLine 'clang', '-dynamiclib', '-fobjc-arc', '-O2', '-arch', 'arm64',
		'-mmacosx-version-min=14.0', '-Wall',
		'-framework', 'Metal', '-framework', 'QuartzCore', '-framework', 'Foundation', '-framework', 'AppKit',
		'-o', nativeOut.get().asFile.absolutePath,
		"${nativeSrc}/ciderlight.m"
}

processResources {
	dependsOn 'buildNative'
	from(nativeOut) { into 'natives' }
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') { expand 'version': version }
	// Apache-2.0: the licence and the notice travel with the jar.
	from(file('LICENSE')) { into 'META-INF' }
	from(file('NOTICE')) { into 'META-INF' }
}

// Exercise binding-cache invalidation and compare cached encoder state against uncached state.
tasks.register('compileBindingChecks', JavaCompile) {
	source 'src/main/java/dev/cidercore/backend/MetalBindingCache.java', 'tests/java'
	classpath = files()
	destinationDirectory = layout.buildDirectory.dir('binding-checks')
}
tasks.register('checkBackendBindings', JavaExec) {
	dependsOn 'compileBindingChecks'
	classpath = files(layout.buildDirectory.dir('binding-checks'))
	mainClass = 'dev.cidercore.backend.MetalBindingCacheChecks'
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn 'checkBackendBindings' }

// Standalone workflow (plan §3.5): `./gradlew publishToMavenLocal`, then ciderlight /
// cidervista can be built from their own folders against dev.cidercore:cidercore:<version>.
publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}
